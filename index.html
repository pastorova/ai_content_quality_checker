<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>AI Content Quality Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f1ec;
      margin: 0;
      padding: 40px;
      color: #1f1f1f;
    }
    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 {
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      font-size: 16px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }
    button {
      background: #111;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }
    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f8f8f8;
      border-radius: 14px;
      white-space: pre-line;
    }
    .tag {
      display: inline-block;
      background: #e8dfd2;
      padding: 6px 10px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="tag">AI nástroj pre obsah</span>
  <h1>AI Content Quality Checker</h1>
  <p>Vlož text a aplikácia vyhodnotí kvalitu obsahu z pohľadu štruktúry, SEO, čitateľnosti a zrozumiteľnosti.</p>

  <textarea id="text" placeholder="Vlož sem text, napríklad popis nehnuteľnosti..."></textarea>

  <button onclick="analyzeText()">Analyzovať text</button>

  <div class="result" id="result"></div>
</div>

<script>
function analyzeText() {
  const text = document.getElementById("text").value;
  const result = document.getElementById("result");

  if (text.trim() === "") {
    result.innerText = "Prosím, vlož najprv nejaký text.";
    return;
  }

  let score = 60;

  if (text.length > 300) score += 10;
  if (text.includes(".") || text.includes(",")) score += 10;
  if (text.toLowerCase().includes("kontakt")) score += 10;
  if (text.toLowerCase().includes("lokalita") || text.toLowerCase().includes("košice")) score += 10;

  if (score > 100) score = 100;

  let feedback = "";

  if (score >= 85) {
    feedback = "Výborný text. Má dobrú štruktúru, jasný účel a pôsobí profesionálne.";
  } else if (score >= 70) {
    feedback = "Text je dobrý, ale dá sa ešte vylepšiť. Odporúčam pridať silnejší nadpis, jasnejšiu výzvu k akcii a viac konkrétnych detailov.";
  } else {
    feedback = "Text potrebuje úpravu. Skús ho rozdeliť na kratšie odseky, doplniť kľúčové slová a jasne povedať, čo má čitateľ urobiť ďalej.";
  }

  result.innerText =
    "Hodnotenie kvality: " + score + "/100\n\n" +
    feedback + "\n\n" +
    "AI odporúčanie:\n" +
    "- pridaj konkrétnu lokalitu\n" +
    "- použi výstižný nadpis\n" +
    "- doplň výzvu k akcii\n" +
    "- text rozdeľ na kratšie časti";
}
</script>

</body>
</html>
