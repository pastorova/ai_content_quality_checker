<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>AI Content Quality Checker</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f7f7f8;
  color: #111;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 160px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 15px;
}

button {
  margin-top: 15px;
  padding: 14px 22px;
  border: none;
  background: black;
  color: white;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

.score {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
}

.good { color: green; }
.medium { color: orange; }
.bad { color: red; }

.block {
  margin-top: 15px;
}

.label {
  font-weight: bold;
  margin-bottom: 5px;
}

ul {
  padding-left: 20px;
}

.improved {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 10px;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="container">

  <h1>AI Content Quality Checker</h1>
  <div class="subtitle">Zlepši svoj text – SEO, čitateľnosť a konverzia</div>

  <div class="card">
    <textarea id="text" placeholder="Vlož text... napr. popis bytu v Košiciach"></textarea>
    <button onclick="analyze()">Analyzovať</button>
  </div>

  <div class="card" id="result" style="display:none;">
    <div class="score" id="score"></div>

    <div class="block">
      <div class="label">❌ Chyby</div>
      <ul id="errors"></ul>
    </div>

    <div class="block">
      <div class="label">💡 Odporúčania</div>
      <ul id="tips"></ul>
    </div>

    <div class="block">
      <div class="label">✨ Vylepšený text</div>
      <div class="improved" id="improved"></div>
    </div>
  </div>

</div>

<script>
function analyze() {
  const text = document.getElementById("text").value;
  const result = document.getElementById("result");

  if (text.trim() === "") {
    alert("Vlož text");
    return;
  }

  let score = 50;
  let errors = [];
  let tips = [];

  if (text.length < 200) {
    errors.push("Text je príliš krátky");
    tips.push("Rozšír text o detaily a benefity");
  } else {
    score += 10;
  }

  if (!text.includes("Košice") && !text.includes("lokalita")) {
    errors.push("Chýba lokalita");
    tips.push("Pridaj konkrétnu lokalitu (napr. Košice)");
  } else {
    score += 10;
  }

  if (!text.toLowerCase().includes("kontakt")) {
    errors.push("Chýba výzva k akcii");
    tips.push("Pridaj CTA – napr. Kontaktujte nás");
  } else {
    score += 10;
  }

  if (!text.includes(".")) {
    errors.push("Text nemá štruktúru viet");
    tips.push("Použi krátke vety a odseky");
  } else {
    score += 10;
  }

  if (score > 100) score = 100;

  // farba skóre
  let scoreClass = "bad";
  if (score >= 75) scoreClass = "good";
  else if (score >= 60) scoreClass = "medium";

  document.getElementById("score").innerHTML =
    "Skóre: <span class='" + scoreClass + "'>" + score + "/100</span>";

  // vypíš chyby
  let errorsHTML = "";
  errors.forEach(e => errorsHTML += "<li>" + e + "</li>");
  document.getElementById("errors").innerHTML = errorsHTML;

  // vypíš tipy
  let tipsHTML = "";
  tips.forEach(t => tipsHTML += "<li>" + t + "</li>");
  document.getElementById("tips").innerHTML = tipsHTML;

  // ✨ vylepšený text
  let improved = 
`🏡 EXKLUZÍVNA PONUKA

Ponúkame na predaj nehnuteľnosť v atraktívnej lokalite.

Táto nehnuteľnosť je ideálna pre bývanie aj investíciu. Vyznačuje sa praktickou dispozíciou a príjemným prostredím.

📍 Lokalita: Košice

💰 Cena: na vyžiadanie

✨ Výhody:
- dobrá dostupnosť
- kompletná občianska vybavenosť
- potenciál rastu hodnoty

📞 Kontaktujte nás pre viac informácií alebo obhliadku.`;

  document.getElementById("improved").innerText = improved;

  result.style.display = "block";
}
</script>

</body>
</html>
